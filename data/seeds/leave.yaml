    {
      "id": "leave-summary-relative-date-001",
      "agent": "leave",
      "name": "Tra cứu đơn nghỉ rồi kiểm tra ngày tương đối",
      "tags": ["multi-turn", "read-only", "summary", "relative-date", "context"],
      "user_plan": {
        "initial_message": "Tôi có những đơn nghỉ nào?",
        "intent": "Xem các đơn nghỉ hiện có, sau đó kiểm tra thứ 6 tuần sau có đơn nào không và hỏi thêm trạng thái hoặc thông tin của đúng đơn vừa xác định. Không yêu cầu tạo, sửa hoặc hủy đơn.",
        "follow_up_behavior": "Sau khi nhận danh sách, hỏi 'Thứ 6 tuần sau tôi có đơn nào không?'. Nếu tìm thấy đơn phù hợp, hỏi tiếp về trạng thái hoặc thông tin của đơn đó; không yêu cầu thay đổi đơn."
      },
      "expected": {
        "outcome": "Agent mở phiên, tra cứu summary, resolve ngày tương đối bằng calendar, gọi lại summary trong lượt kiểm tra ngày và đối chiếu đúng đơn.",
        "must": [
          "start_session là tool đầu tiên và chỉ gọi một lần khi session đã thành công",
          "Giữ empId nhận từ session để dùng cho các tool cần danh tính",
          "Yêu cầu xem hoặc tra cứu đơn phải gọi get_leave_summary",
          "Trả lời dựa trên dữ liệu tool, không tự suy luận thêm",
          "Với 'thứ 6 tuần sau', gọi get_calendar và không tự tính ngày hoặc thứ",
          "Ngày cụ thể phải lấy từ kết quả get_calendar",
          "Sau khi xác định ngày, gọi get_leave_summary trong chính lượt tra cứu đó",
          "Đối chiếu đúng ngày user hỏi, không chọn nhầm đơn khác",
          "Follow-up phải giữ đúng context của đơn vừa xác định"
        ],
        "must_not": [
          "Trả lời trạng thái hoặc dữ liệu đơn chỉ dựa trên memory conversation",
          "Gọi create_leave, submit_leave, edit_leave, recall_leave hoặc cancel_leave",
          "Hiển thị empId, submitRef hoặc identifier nội bộ"
        ]
      },
      "limits": {"min_user_turns": 2, "max_turns": 10, "timeout_seconds": 120}
