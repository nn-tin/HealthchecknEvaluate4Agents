name: ticketagents-monitoring
services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketagents
      POSTGRES_USER: ticketagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?Set GRAFANA_READER_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-reader.sh:/docker-entrypoint-initdb.d/10-reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketagents -d ticketagents"]
      interval: 5s
      timeout: 5s
      retries: 20
  scheduler:
    build: ..
    image: ticketagents-local:monitoring
    restart: unless-stopped
    env_file: ../.env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ticketagents
      PGUSER: ticketagents
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_URL: "dbname=ticketagents"
      RESULT_SINK: json,postgres
    volumes:
      - ../data/runs:/app/data/runs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert time.time()-Path('/tmp/scheduler-heartbeat').stat().st_mtime < 900"]
      interval: 30s
      timeout: 10s
      start_period: 120s
  evaluation-scheduler:
    build: ..
    image: ticketagents-local:monitoring
    restart: unless-stopped
    command: ["python", "run.py", "evaluation-scheduler"]
    env_file: ../.env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ticketagents
      PGUSER: ticketagents
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_URL: "dbname=ticketagents"
      RESULT_SINK: json,postgres
    volumes:
      - ../data/runs:/app/data/runs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert time.time()-Path('/tmp/evaluation-scheduler-heartbeat').stat().st_mtime < 7200"]
      interval: 30s
      timeout: 10s
      start_period: 120s
  reports:
    image: ticketagents-local:monitoring
    build: ..
    restart: unless-stopped
    command: ["python", "-m", "eval_tool.report_server"]
    env_file: ../.env
    environment:
      REPORT_PASSWORD: ${REPORT_PASSWORD:?Set REPORT_PASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ticketagents
      PGUSER: ticketagents
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_URL: "dbname=ticketagents"
      RESULT_SINK: json,postgres
      CONTROL_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ../data/runs:/app/data/runs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?Set GRAFANA_READER_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_healthy
volumes:
  postgres_data:
  grafana_data:
